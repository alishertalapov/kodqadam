<title>КодҚадам</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: app shell — slim left rail on desktop, bottom tab bar on phones; content in airy white panels on a cool sky ground. Python blue + sunny yellow come straight from the language's own colours. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F5F9; --line:#E3E8EF;
  --ink:#15273A; --muted:#5E6E80;
  --blue:#2A72DE; --blue-soft:#E2EEFD; --blue-ink:#17509F;
  --sun:#FFC83A; --sun-soft:#FFF3CC; --sun-ink:#7A5600;
  --mint:#13B07E; --mint-soft:#DBF5EA; --mint-ink:#0A6B4C;
  --coral:#EE5D52; --coral-soft:#FDE6E3; --coral-ink:#A3302A;
  --code-bg:#FAFBFD; --code-kw:#7A3FD1; --code-str:#0B8A5E; --code-num:#C2510E; --code-com:#8A9AAC; --code-fn:#1D63C9;
  --shadow:0 1px 2px rgba(21,39,58,.05),0 4px 16px rgba(21,39,58,.05);
  --f-display:"Rubik","Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
/* single light theme on purpose: always white */

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
code,.mono{font-family:var(--f-code);font-size:.92em}
code{background:var(--surface-2);padding:1px 6px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.35rem,2.6vw,1.8rem);line-height:1.2}
h2{font-size:1.15rem;line-height:1.3}
h3{font-size:.98rem;line-height:1.35}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding:0 8px}
.logo-mark{width:34px;height:34px;flex:none}
.logo b{color:var(--blue)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--muted);text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.streak-chip{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--sun-soft);color:var(--sun-ink);font-weight:800}
.streak-chip svg{width:22px;height:22px;flex:none}
.py-status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:7px;padding:0 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
.dot.ok{background:var(--mint)} .dot.bad{background:var(--coral)}

main{min-width:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:800;line-height:1.2;transition:transform .12s,background .15s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-sun{background:var(--sun);color:#3A2A00}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{border:0;background:none;color:var(--blue);font-weight:800;padding:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.crumbs button{border:0;background:none;color:var(--blue);font-weight:800;padding:2px 0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.hello{padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hello::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--sun-soft) 0 60%,transparent 61%);z-index:0}
.hello>*{position:relative;z-index:1}
.goal{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.goal-bar{flex:1 1 180px;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--mint));border-radius:99px;transition:width .5s}
.mini-stats{padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ms{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.ms .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.ms .l{font-size:.82rem;color:var(--muted);font-weight:700}

.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.topic{display:flex;flex-direction:column;gap:14px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.topic:hover{transform:translateY(-2px);border-color:var(--blue)}
.topic-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.snip{font-family:var(--f-code);font-weight:600;font-size:.85rem;padding:6px 10px;border-radius:10px}
.t-blue .snip{background:var(--blue-soft);color:var(--blue-ink)}
.t-sun .snip{background:var(--sun-soft);color:var(--sun-ink)}
.t-mint .snip{background:var(--mint-soft);color:var(--mint-ink)}
.t-coral .snip{background:var(--coral-soft);color:var(--coral-ink)}
.ring{width:46px;height:46px;flex:none}
.ring text{font:800 11px var(--f-body);fill:var(--ink)}
.lv-row{display:flex;gap:6px;flex-wrap:wrap}
.lv{font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:99px}
.lv1{background:var(--mint-soft);color:var(--mint-ink)}
.lv2{background:var(--sun-soft);color:var(--sun-ink)}
.lv3{background:var(--coral-soft);color:var(--coral-ink)}

/* topic page */
.topic-head{padding:22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:800;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tasks{display:flex;flex-direction:column;gap:10px}
.task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:border-color .15s}
.task-row:hover{border-color:var(--blue)}
.state{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--surface-2);color:var(--muted)}
.state svg{width:18px;height:18px}
.state.done{background:var(--mint);color:#fff}
.state.tried{background:var(--sun-soft);color:var(--sun-ink)}
.task-row .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-weight:700}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:800;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--blue-soft);color:var(--blue-ink)}
.tab-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.statement{font-size:1.02rem}
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.io{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.io .h{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;background:var(--surface-2)}
.io pre{margin:0;padding:10px;font-family:var(--f-code);font-size:.86rem;white-space:pre-wrap;word-break:break-word;min-height:2.4em}
.explain dl{display:grid;gap:12px;margin:0}
.explain dt{font-weight:800;display:flex;align-items:center;gap:8px}
.explain dt::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--blue);flex:none}
.explain dd{margin:2px 0 0 16px;color:var(--ink)}
.hint{border:1px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.hint .n{width:26px;height:26px;border-radius:8px;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font-weight:800;flex:none;font-size:.85rem}
.hint.locked{color:var(--muted)}
.mist{display:flex;flex-direction:column;gap:10px}
.mist li{list-style:none;border-left:3px solid var(--coral);padding:4px 0 4px 12px}
.mist ul{margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mist b{display:block}

.editor-card{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-file{font-family:var(--f-code);font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.ed-file i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--blue) 50%,var(--sun) 50%);display:inline-block}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--code-bg);height:340px;position:relative}
.gutter{font-family:var(--f-code);font-size:14px;line-height:22px;padding:12px 8px 12px 12px;color:var(--code-com);text-align:right;user-select:none;overflow:hidden;border-right:1px solid var(--line);min-width:42px}
.gutter span{display:block;border-radius:5px;padding:0 4px}
.gutter span.err{background:var(--coral);color:#fff}
.code-wrap{position:relative;min-width:0;overflow:hidden}
.code-wrap pre,.code-wrap textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font-family:var(--f-code);font-size:14px;line-height:22px;white-space:pre;tab-size:4;border:0;overflow:auto;letter-spacing:0}
.code-wrap pre{pointer-events:none;color:var(--ink);overflow:hidden}
.code-wrap textarea{background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;-webkit-text-fill-color:transparent}
.code-wrap textarea::selection{background:rgba(42,114,222,.28);-webkit-text-fill-color:transparent}
.errbar{position:absolute;left:0;right:0;height:22px;background:var(--coral-soft);opacity:.85;pointer-events:none}
.tk-kw{color:var(--code-kw);font-weight:600}.tk-str{color:var(--code-str)}.tk-num{color:var(--code-num)}.tk-com{color:var(--code-com);font-style:italic}.tk-fn{color:var(--code-fn)}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line);align-items:center}
.ed-actions .grow{flex:1}
.kbd{font-size:.78rem;color:var(--muted);font-weight:700}
details.own-input{border-top:1px solid var(--line)}
details.own-input summary{padding:10px 14px;font-weight:800;font-size:.9rem;cursor:pointer;color:var(--muted)}
details.own-input .oi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 12px}
details.own-input textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);padding:8px 10px;font-family:var(--f-code);font-size:.86rem;resize:vertical}
details.own-input pre{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);padding:8px 10px;font-family:var(--f-code);font-size:.86rem;min-height:90px;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:200px}
.prompt-echo{color:var(--muted)}

.feedback{padding:18px;display:flex;flex-direction:column;gap:14px}
.fb-idle{display:flex;gap:14px;align-items:center;color:var(--muted)}
.fb-idle svg{width:40px;height:40px;flex:none}
.tests{display:flex;gap:8px;flex-wrap:wrap}
.tpill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-weight:800;font-size:.84rem}
.tpill.ok{background:var(--mint-soft);color:var(--mint-ink)}
.tpill.bad{background:var(--coral-soft);color:var(--coral-ink)}
.coach{border-radius:12px;background:var(--coral-soft);padding:16px;display:flex;flex-direction:column;gap:12px}
.coach.warn{background:var(--sun-soft)}
.coach-h{display:flex;gap:10px;align-items:center}
.coach-h .ic{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--coral-ink)}
.coach.warn .coach-h .ic{color:var(--sun-ink)}
.coach-h .ic svg{width:20px;height:20px}
.coach .tag{font-family:var(--f-code);font-size:.8rem;font-weight:600;opacity:.8}
.coach-sec{background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.coach-sec h4{margin:0;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.coach-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.err-line{font-family:var(--f-code);font-size:.86rem;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-x:auto;white-space:pre}
.err-raw{font-family:var(--f-code);font-size:.8rem;color:var(--muted);word-break:break-word}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.success{border-radius:12px;background:var(--mint-soft);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.success .burst{width:56px;height:56px;flex:none}
.success .xp{font-family:var(--f-display);font-weight:700;color:var(--mint-ink);font-size:1.3rem}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.success .burst{animation:pop .5s ease-out}
.mentor{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mentor-row{display:flex;gap:8px;flex-wrap:wrap}
.mentor-row input{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.mentor-ans{white-space:pre-wrap;background:var(--blue-soft);color:var(--ink);border-radius:10px;padding:12px 14px}
.spinner{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{padding:18px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.1}
.tile .l{color:var(--muted);font-weight:700;font-size:.88rem}
.tile.blue .v{color:var(--blue)} .tile.sun .v{color:var(--sun-ink)} .tile.mint .v{color:var(--mint)} .tile.coral .v{color:var(--coral)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.card-pad{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;width:max-content}
.heat .c{width:14px;height:14px;border-radius:4px;background:var(--surface-2)}
.heat .c.l1{background:color-mix(in srgb,var(--mint) 35%,var(--surface-2))}
.heat .c.l2{background:color-mix(in srgb,var(--mint) 65%,var(--surface-2))}
.heat .c.l3{background:var(--mint)}
.heat .c.today{outline:2px solid var(--blue);outline-offset:1px}
.heat-row{display:flex;gap:8px}
.heat-days{display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-size:.68rem;color:var(--muted);font-weight:700;line-height:14px}
.legend{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:700}
.legend .c{width:12px;height:12px;border-radius:3px;display:inline-block}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar-row .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar-row.full .track i{background:var(--mint)}
.bar-row .name{font-weight:700;min-width:0}
.errmap .bar-row .track i{background:var(--coral)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.badge .bi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.badge .bi svg{width:20px;height:20px}
.badge.on .bi{background:var(--sun);color:#3A2A00}
.badge:not(.on){opacity:.6}
.badge b{display:block;font-size:.88rem;line-height:1.25}
.badge small{color:var(--muted);font-size:.76rem;font-weight:700;line-height:1.2;display:block}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* rating */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:#fff}

<script type="module">
const V="12.19.0",B="https://www.gstatic.com/firebasejs/"+V+"/";
const C=window.KODQADAM_CONFIG||{};
try{
  if(!C.firebase||!C.firebase.apiKey||/ОСЫ|PASTE|xxx/i.test(C.firebase.apiKey))throw new Error("noconfig");
  const {initializeApp}=await import(B+"firebase-app.js");
  const A=await import(B+"firebase-auth.js");
  const F=await import(B+"firebase-firestore.js");
  const app=initializeApp(C.firebase);
  if(C.recaptchaSiteKey){try{const AC=await import(B+"firebase-app-check.js");AC.initializeAppCheck(app,{provider:new AC.ReCaptchaEnterpriseProvider(C.recaptchaSiteKey),isTokenAutoRefreshEnabled:true})}catch(e){console.warn("App Check",e)}}
  const auth=A.getAuth(app);try{await A.setPersistence(auth,A.browserLocalPersistence)}catch(e){}
  const fs=F.getFirestore(app);
  const W=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
  const DB={
    doc:p=>{const r=F.doc(fs,p);return {get:async()=>W(await F.getDoc(r)),set:d=>F.setDoc(r,d),update:d=>F.setDoc(r,d,{merge:true}),delete:()=>F.deleteDoc(r)}},
    collection:p=>{const c=F.collection(fs,p);return {add:d=>F.addDoc(c,d),onSnapshot:(next,err)=>F.onSnapshot(c,qs=>next({docs:qs.docs.map(W)}),err)}}
  };
  let AI=null;
  if(C.ai!==false){try{
    const M=await import(B+"firebase-ai.js");
    const ai=M.getAI(app,{backend:new M.GoogleAIBackend()});
    const model=M.getGenerativeModel(ai,{model:C.aiModel||"gemini-3.8-flash"});
    const jmodel=M.getGenerativeModel(ai,{model:C.aiModel||"gemini-3.8-flash",generationConfig:{responseMimeType:"application/json"}});
    const mapErr=e=>{const m=String(e&&(e.message||e));return {code:/429|quota|RESOURCE_EXHAUSTED|rate/i.test(m)?"rate_limited":/403|PERMISSION|App Check|app-check/i.test(m)?"not_granted":"unavailable",message:m}};
    AI=async(prompt,opts={})=>{try{const r=await model.generateContentStream(prompt);let text="";for await(const ch of r.stream){text+=ch.text();opts.onText&&opts.onText({text})}return {text,truncated:false}}catch(e){console.warn("AI",e);throw mapErr(e)}};
    AI.json=async prompt=>{try{const r=await jmodel.generateContent(prompt);const t=r.response.text().trim().replace(/^```(?:json)?\s*|\s*```$/g,"");return JSON.parse(t)}catch(e){console.warn("AI",e);throw mapErr(e)}};
  }catch(e){console.warn("AI init",e);AI=null}}
  let app2=null;
  const createStudent=async(email,pw)=>{if(!app2)app2=initializeApp(C.firebase,"creator");const a2=A.getAuth(app2);try{await A.setPersistence(a2,A.inMemoryPersistence)}catch(e){}const cr=await A.createUserWithEmailAndPassword(a2,email,pw);const uid=cr.user.uid;await A.signOut(a2);return uid};
  window.FBAPI={ok:true,DB,AI,domain:C.loginDomain||C.firebase.authDomain,
    login:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),logout:()=>A.signOut(auth),register:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
    onUser:f=>A.onAuthStateChanged(auth,f),createStudent};
}catch(e){console.error(e);window.FBAPI={ok:false,error:e&&e.message==="noconfig"?"noconfig":String(e&&e.message||e)}}
window.dispatchEvent(new Event("fb-ready"));

{id:"io2",t:"io",lv:1,title:"Амандасу",

 mist:[["print(\"Сәлем,\", name, \"!\") деп жазу","Үтірмен бөлгенде леп белгісінің алдына артық бос орын қосылады."],["print(\"Сәлем, name!\")","Тырнақша ішіндегі name — жай мәтін. Айнымалының мәні емес, «name» сөзінің өзі шығады."]]},

 text:"Екі жол енгізіледі. Оларды кері ретпен шығар: алдымен екіншісін, сосын біріншісін, әрқайсысын жеке жолда.",

 hints:["Екі жолды оқу үшін input() екі рет керек.","Әр жолды өз айнымалысына сақта, сонда кез келген ретпен шығара аласың.","Екі print() — екі жол."],
 mist:[["Бір input() арқылы екі жолды оқуға тырысу","input() тек бір жолды оқиды."],["Оқыған бойда шығару","Бірінші жолды оқып бірден шығарсаң, рет өзгермейді. Алдымен екеуін де оқы."]]},

 ex:{given:"Үш жол: аты, жасы, қаласы.",need:"Бір жол, бөліктер арасы « | » (бос орын, тік сызық, бос орын).",know:"f-жол немесе жолдарды біріктіру. Жасты санға айналдырудың қажеті жоқ, ол тек шығарылады.",walk:"Әлия, 14, Ақтау → «Аты: Әлия | Жасы: 14 | Қаласы: Ақтау»."},

{id:"m1",t:"math",lv:1,title:"Екі санның қосындысы",

{id:"m2",t:"math",lv:1,title:"Тіктөртбұрыш",
 text:"Тіктөртбұрыштың ұзындығы <code>a</code> мен ені <code>b</code> енгізіледі (бүтін сандар, жеке жолдарда). Бір жолға бос орын арқылы алдымен ауданын, сосын периметрін шығар.",

 ex:{given:"Екі бүтін сан: a және b.",need:"Екі сан бір жолда: аудан, бос орын, периметр.",know:"Аудан = a · b, периметр = 2 · (a + b). <code>print(x, y)</code> мәндердің арасына бос орын қояды.",walk:"a = 3, b = 4: аудан 12, периметр 2 · 7 = 14 → «12 14»."},

 mist:[["2 * a + b деп жазу","Көбейту қосудан бұрын орындалады: бұл 2a + b болады, ал керегі 2(a + b)."],["Периметрді бірінші шығару","Рет маңызды: алдымен аудан."]]},
{id:"m3",t:"math",lv:2,title:"Минуттан сағатқа",
 text:"<code>n</code> минут енгізіледі. Оны толық сағат пен қалған минутқа айналдырып, бос орын арқылы шығар.",

 hints:["Бір сағатта неше минут бар?","Қанша толық сағат сыятынын табатын амал — //.","Қалдықты табатын амал — %."],
 mist:[["/ қолдану","/ бөлшек сан береді: 135 / 60 = 2.25. Бізге бүтін бөлігі керек."],["Минутты 100-ге бөлу","Сағатта 60 минут бар."]]},
{id:"m4",t:"math",lv:3,title:"Цифрлар қосындысы",

{id:"c1",t:"cond",lv:1,title:"Жұп па, тақ па?",
 text:"Бүтін сан енгізіледі. Ол жұп болса <code>Жұп</code>, тақ болса <code>Тақ</code> деп шығар.",

{id:"c2",t:"cond",lv:2,title:"Ең үлкені",

{id:"c4",t:"cond",lv:3,title:"Кібісе жыл",

const KNOWN=["print","input","int","float","str","len","range","list","dict","sum","min","max","abs","round","sorted","return","while","for","if","else","elif","def","split","append","True","False","None"];
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

function coachError(err,code){
  let key=err.type;
  if(/indent/i.test(err.msg)) key="IndentationError";
  if(/time limit|timeout/i.test(err.msg)||key==="TimeoutError") key="TimeoutError";
  if(/recursion/i.test(err.msg)) key="RecursionError";
  const base=ERR[key]||ERR.Other;
  const lines=code.split("\n");
  const ln=err.line&&err.line<=lines.length?err.line:null;
  const src=ln?lines[ln-1]:"";
  const specific=[];
  if(key==="NameError"){
    const m=err.msg.match(/name '([^']+)'/);
    if(m){
      const nm=m[1];
      let best=null,bd=9;KNOWN.forEach(k=>{const d=lev(nm.toLowerCase(),k.toLowerCase());if(d<bd){bd=d;best=k}});
      if(nm.toLowerCase()===best?.toLowerCase()&&nm!==best) specific.push(`<b>${esc(nm)}</b> деп жазылған. Python бас және кіші әріпті ажыратады — қалай жазылатынын еске түсір.`);
      else if(best&&bd>0&&bd<=2&&nm.length>2) specific.push(`<b>${esc(nm)}</b> — Python білетін <b>${esc(best)}</b> сөзіне өте ұқсас. Әріптерін салыстыр.`);
      else if(/[^\x00-\x7F]/.test(nm)) specific.push(`<b>${esc(nm)}</b> — бұл мәтін сияқты. Мәтін болса, оны тырнақшаға алу керек пе?`);
      else specific.push(`<b>${esc(nm)}</b> атауы осы жолға дейін құрылды ма? Айнымалыны алдымен = арқылы құру керек.`);
    }
  }
  if(key==="SyntaxError"||key==="IndentationError"){
    const check=ln?[ln,ln-1].filter(x=>x>0):[];
    for(const k of check){const s=lines[k-1]||"";const tr=s.trim();
      if(/^(if|elif|else|for|while|def)\b/.test(tr)&&!tr.replace(/#.*$/,"").trimEnd().endsWith(":")){specific.push(`${k}-жол «${esc(tr.split(/\s/)[0])}» сөзімен басталады. Мұндай жол немен аяқталуы керек?`);break}
      if(/^(if|elif|while)\b/.test(tr)&&/[^=!<>]=[^=]/.test(tr)){specific.push(`${k}-жолда шарт ішінде жалғыз <code>=</code> тұр. Салыстыру үшін қандай белгі керек?`);break}
      const op=(s.match(/\(/g)||[]).length,cl=(s.match(/\)/g)||[]).length;
      if(op!==cl){specific.push(`${k}-жолда ашылған жақша саны (${op}) мен жабылған жақша саны (${cl}) сәйкес емес.`);break}
      const dq=(s.match(/"/g)||[]).length,sq=(s.match(/'/g)||[]).length;
      if(dq%2||sq%2){specific.push(`${k}-жолда тырнақша жұпсыз қалған сияқты.`);break}
    }
    if(key==="IndentationError"&&ln&&!specific.length) specific.push(`${ln}-жолдың басындағы бос орындарды санап көр. Оның үстіндегі жолмен қалай байланысты?`);
  }
  if(key==="TypeError"){
    if(/concatenate|'str' and 'int'|'int' and 'str'|can only concatenate/i.test(err.msg)) specific.push("Мұнда мәтін (str) мен сан (int) бір амалда кездесті. input() нені қайтаратынын еске түсір.");
    else if(/not supported between/i.test(err.msg)) specific.push("Мәтін мен санды салыстыруға болмайды. Салыстырылып тұрған екі мәннің түрі бірдей ме?");
    else if(/NoneType/i.test(err.msg)) specific.push("Бір мән None болып тұр. Функцияң return арқылы нәтиже қайтара ма?");
    else if(/argument/i.test(err.msg)) specific.push("Функцияға берілген аргументтер саны оның анықтамасымен сәйкес емес.");
    else if(/not callable/i.test(err.msg)) specific.push("Сен функция емес нәрсені жақшамен шақырдың. Мүмкін, айнымалыға функция атын (sum, max, list) бергенсің бе?");
    else if(/join|sequence item/i.test(err.msg)) specific.push("join тек жолдарды біріктіреді. Тізімде сандар тұрған жоқ па?");
  }
  if(key==="ValueError"&&/invalid literal/i.test(err.msg)){const m=err.msg.match(/: '(.*)'$/);if(m) specific.push(`int()-ке <code>${esc(m[1])}</code> деген мән берілді. Бұл бір ғана бүтін сан ба?`)}
  return {key,base,ln,src,specific};
}

function compareOutput(got,exp){
  const norm=s=>s.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");
  const g=norm(got),e=norm(exp);
  if(g===e) return {ok:true};
  let why;
  const gl=g?g.split("\n"):[],el=e.split("\n");
  if(!g) why="Бағдарлама ештеңе шығармады. Нәтижені print() арқылы шығардың ба? Функция болса, ол шақырылды ма?";
  else if(g.toLowerCase()===e.toLowerCase()) why="Мәтін дұрыс, бірақ бас және кіші әріптер сәйкес емес.";
  else if(g.replace(/\s/g,"")===e.replace(/\s/g,"")) why="Таңбалар дұрыс, бірақ бос орындар не жол ауыстыру басқаша. Үтір мен леп белгісінің айналасын тексер.";
  else if(/^-?\d+$/.test(e)&&g===e+".0") why="Жауап бөлшек сан болып шықты (.0). Қай амал бөлшек нәтиже береді: / ма, // ма?";
  else if(/^-?\d+$/.test(e)&&/^-?\d+$/.test(g)&&g.length>e.length&&!isNaN(+g)) why="Сан тым үлкен шықты. Мүмкін, сандар қосылмай, мәтін ретінде біріктіріліп кеткен шығар? input() нені қайтарады?";
  else if(/^\[.*\]$/.test(g)) why="Тізім жақшаларымен шығып тұр. Шартта элементтер бос орын арқылы шығуы керек.";
  else if(gl.length>el.length&&gl[gl.length-1]===el[el.length-1]) why=`Соңғы жол дұрыс, бірақ артық жолдар бар (${gl.length} жол, ал керегі ${el.length}). print() цикл ішінде тұрған жоқ па?`;
  else if(gl.length!==el.length) why=`Жолдар саны сәйкес емес: күтілгені ${el.length}, сенікі ${gl.length}.`;
  else{let i=0;while(i<el.length&&gl[i]===el[i])i++;why=`${i+1}-жолдан бастап айырмашылық бар. Осы мысалды қолмен, қадамдап есептеп көр.`}
  return {ok:false,why};
}

let pyReady=false;
function checkPy(){

function runPy(code,inputs){
  return new Promise(resolve=>{
    if(!pyReady){resolve({out:"",prompts:"",err:{type:"Other",msg:"Python әлі жүктелген жоқ. Бетті қайта жүктеп көр.",line:null}});return}
    let out="",prompts="";const q=inputs.slice();
    const transcript=[];
    Sk.configure({
      output:t=>{out+=t;transcript.push(t)},
      read:x=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw "File not found: '"+x+"'";return Sk.builtinFiles.files[x]},
      inputfunTakesPrompt:true,
      inputfun:p=>{if(p){prompts+=p}if(!q.length){const E=Sk.builtin.EOFError||Sk.builtin.RuntimeError;throw new E("EOF when reading a line")}const v=q.shift();transcript.push((p||"")+"\u0001"+v+"\n");return v},
      __future__:Sk.python3,execLimit:3000,yieldLimit:100,killableWhile:true,killableFor:true
    });
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true))
      .then(()=>resolve({out,transcript,err:null}))
      .catch(e=>{
        let s=String(e&&e.toString?e.toString():e),line=null;
        try{if(e.traceback&&e.traceback.length)line=e.traceback[0].lineno}catch(_){}
        const m=s.match(/ on line (\d+)/);if(!line&&m)line=+m[1];
        s=s.replace(/ on line \d+/,"");
        let type=(s.match(/^([A-Za-z]+(Error|Exception|Exit)?)/)||[,"Other"])[1];
        if(/exceeded run time|time limit/i.test(s))type="TimeoutError";
        resolve({out,transcript,err:{type,msg:s,line}});
      });
  });
}

/* ---- step-by-step tracer: inserts __tr(line, globals()) before each statement ---- */
function instrument(code,mode){
  /* mode 2: globals+locals inside functions, 1: globals only, 0: no variables */
  const lines=code.replace(/\t/g,"    ").split("\n");let depth=0,cont=false;const out=[];const defs=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i],tr=L.trim();const ind=(L.match(/^\s*/)||[""])[0];
    if(depth===0&&!cont&&tr&&!tr.startsWith("#")){
      while(defs.length&&ind.length<=defs[defs.length-1])defs.pop();
      if(!/^(elif|else|except|finally)\b/.test(tr)&&!tr.startsWith("@")){
        const args=mode===0?"{}":mode===2&&defs.length?"globals(), locals()":"globals()";
        out.push(ind+"__tr("+(i+1)+", "+args+")");
      }
      if(/^def\s/.test(tr))defs.push(ind.length);
    }
    out.push(L);
    let inS=null;for(let j=0;j<L.length;j++){const c=L[j];if(inS){if(c==="\\"){j++;continue}if(c===inS)inS=null;continue}if(c==="#")break;if(c==='"'||c==="'"){inS=c;continue}if("([{".includes(c))depth++;else if(")]}".includes(c))depth=Math.max(0,depth-1)}
    cont=/\\\s*$/.test(L);
  }
  out.push("__tr(0, "+(mode===0?"{}":"globals()")+")");
  const pre='def __tr(__n, __g, __l=None):\n    __d = dict(__g)\n    if __l:\n        __d.update(__l)\n    __trjs(__n, [[__k, repr(__v), type(__v).__name__] for __k, __v in __d.items() if not __k.startswith("__") and type(__v).__name__ not in ("function", "module", "type", "builtin_function_or_method", "method")])\n';
  return pre+out.join("\n");
}
function runTrace(code,inputs){
  return new Promise(resolve=>{
    if(!pyReady){resolve({steps:[],err:{type:"Other",msg:"Python әлі жүктелген жоқ.",line:null}});return}
    const attempt=(withG)=>new Promise(res=>{
      let out="";const steps=[];const q=inputs.slice();
      try{
        Sk.builtins["__trjs"]=new Sk.builtin.func(function(n,lst){
          let vars=[];try{vars=Sk.ffi.remapToJs(lst)}catch(e){}
          steps.push({line:Sk.ffi.remapToJs(n),vars,out});
          if(steps.length>400)throw new Sk.builtin.RuntimeError("STEP_LIMIT");
          return Sk.builtin.none.none$;
        });
      }catch(e){res({steps:[],err:{type:"Other",msg:"Қадамдап көру бұл браузерде қолжетімсіз.",line:null}});return}
      Sk.configure({
        output:t=>{out+=t},
        read:x=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw "File not found: '"+x+"'";return Sk.builtinFiles.files[x]},
        inputfunTakesPrompt:true,
        inputfun:p=>{if(p)out+=p;if(!q.length){const E=Sk.builtin.EOFError||Sk.builtin.RuntimeError;throw new E("EOF when reading a line")}const v=q.shift();out+=v+"\n";return v},
        __future__:Sk.python3,execLimit:4000,yieldLimit:100,killableWhile:true,killableFor:true
      });
      Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<trace>",false,instrument(code,withG),true))
        .then(()=>res({steps,out,err:null}))
        .catch(e=>{const s=String(e&&e.toString?e.toString():e).replace(/ on line \d+/,"");res({steps,out,err:{type:(s.match(/^([A-Za-z]+)/)||[,"Other"])[1],msg:s,limit:/STEP_LIMIT/.test(s)}})});
    });
    attempt(2).then(r=>{
      if(r.err&&/locals|update/i.test(r.err.msg))return attempt(1);
      return r;
    }).then(r=>{
      if(r.err&&!r.steps.length&&/globals|dict|items/i.test(r.err.msg))return attempt(0);
      return r;
    }).then(resolve);
  });
}

  $("#whoBox").innerHTML=`<span class="sav" style="background:${S.role==="teacher"?"var(--sun-ink)":avColor(UID||nm)}">${esc(nm.charAt(0).toUpperCase())}</span><span style="min-width:0">${esc(nm)}<small>${S.role==="teacher"?"бақылау режимі":(S.cls?esc(S.cls)+" сынып":"оқушы")}</small></span>`;
  $("#streakChip").hidden=S.role!=="student";
  updateRailInstall();
}
function render(){
  if(!S.role){$("#app").hidden=true;const g=$("#gate");g.hidden=false;g.innerHTML=gateV();bindGate();return}
  $("#gate").hidden=true;$("#gate").innerHTML="";$("#app").hidden=false;
  if(S.role==="student"&&["class","tstudent","assign","accounts"].includes(route.v))route={v:"home"};
  if(S.role==="teacher"&&route.v==="progress")route={v:"class"};
  const v=route.v;
  buildNav();
  const st=streakOf(S.days);$("#streakText").textContent=st+" күн қатарынан";
  const view=$("#view");
  if(v==="class")view.innerHTML=classV();
  else if(v==="tstudent")view.innerHTML=studentDetailV(route.id);
  else if(v==="assign")view.innerHTML=assignV();
  else if(v==="accounts")view.innerHTML=accountsV();
  else if(v==="home")view.innerHTML=homeV();
  else if(v==="topic")view.innerHTML=topicV(route.id,route.lv||0);
  else if(v==="task"){view.innerHTML=taskV(route.id);mountTask(route.id)}
  else if(v==="progress")view.innerHTML=progressV();
  else if(v==="rating")view.innerHTML=ratingV();
  bindView();
}

/* ---- home ---- */
function nextTask(){for(const t of TASKS)if(!S.solved[t.id]&&S.attempts[t.id])return t;return TASKS.find(t=>!S.solved[t.id])}
function topicsGrid(){
  return `<div class="topics">${TOPICS.map(tp=>{const ts=TASKS.filter(t=>t.t===tp.id),d=ts.filter(t=>S.solved[t.id]).length;const c=[1,2,3].map(l=>ts.filter(t=>t.lv===l).length);
      return `<button class="topic ${tp.tone}" data-topic="${tp.id}"><div class="topic-top"><span class="snip">${esc(tp.snip)}</span>${S.role==="teacher"?`<span class="lv lv1">${ts.length} есеп</span>`:ring(d/ts.length)}</div><div style="display:flex;flex-direction:column;gap:4px"><h3>${esc(tp.name)}</h3><p class="muted" style="font-size:.9rem">${esc(tp.about)}</p></div><div class="lv-row">${c.map((n,i)=>n?`<span class="lv lv${i+1}">${LV[i+1]} · ${n}</span>`:"").join("")}</div></button>`}).join("")}</div>`;
}
const MONTHS=["қаңтар","ақпан","наурыз","сәуір","мамыр","маусым","шілде","тамыз","қыркүйек","қазан","қараша","желтоқсан"];
function fmtDate(d){if(!d)return "";const [y,m,dd]=d.split("-").map(Number);return dd+" "+MONTHS[m-1]}
function dueText(d){if(!d)return "мерзімсіз";const diff=Math.ceil((new Date(d+"T23:59:59")-new Date())/864e5);if(diff<0)return "мерзімі өтті";if(diff===0)return "бүгін тапсыру";if(diff===1)return "ертең тапсыру";return diff+" күн қалды"}
function myAssign(){const c=(S.cls||"").trim().toUpperCase();return ASSIGN.filter(a=>!a.cls||a.cls.toUpperCase()===c)}
function hwCard(){
  const as=myAssign().filter(a=>!(a.due&&new Date(a.due+"T23:59:59")<Date.now()-7*864e5));
  if(!as.length)return "";
  return `<section class="panel card-pad hw"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>Үй жұмысы</h2><span class="note">Мұғалім берген тапсырмалар</span></div>${as.map(a=>{const ts=(a.tasks||[]).map(i=>TASK[i]).filter(Boolean);const d=ts.filter(t=>S.solved[t.id]).length;const dt=dueText(a.due);
    return `<div class="hw-item"><div class="hw-top"><div style="min-width:0"><b>${esc(a.title||"Үй жұмысы")}</b>${a.due?`<span class="muted"> · ${esc(fmtDate(a.due))} дейін</span>`:""}</div><span class="pill ${d===ts.length?"ok":dt==="мерзімі өтті"?"bad":"try"}">${d===ts.length?"Орындалды":esc(dt)}</span></div>
    <div class="goal-bar" style="flex:none"><i style="width:${ts.length?d/ts.length*100:0}%"></i></div>
    <div class="hw-tasks">${ts.map(t=>`<button class="chip-task ${S.solved[t.id]?"done":""}" data-task="${t.id}">${S.solved[t.id]?ICON.check.replace('<svg','<svg width="12" height="12"'):""}${esc(t.title)}</button>`).join("")}</div></div>`}).join("")}</section>`;
}
function dailyCard(){
  const t=dailyTask();const done=S.daily[today()];
  return `<section class="panel daily"><span class="daily-ic">${ICON.star}</span><div style="min-width:0;flex:1"><span class="eyebrow">Күн есебі · +10 XP бонус</span><h3>${esc(t.title)}</h3><span class="muted" style="font-size:.88rem">${esc(TOPICS.find(x=>x.id===t.t).name)} · ${LV[t.lv]}</span></div>${done?`<span class="pill ok">Бүгін орындалды</span>`:`<button class="btn btn-sun" data-task="${t.id}">Шешу</button>`}</section>`;
}
function recCard(st,forTeacher){
  const r=recommend(st);
  return `<section class="panel rec"><div class="rec-h"><span class="ic">${ICON.rocket}</span><div style="min-width:0"><span class="eyebrow">${forTeacher?"Жүйе ұсынысы (қате тарихы бойынша)":"Саған ұсыныс"}</span><h3>${esc(r.title)}</h3></div></div><p>${esc(r.text)}</p>${r.tasks.length?`<div class="rec-tasks">${r.tasks.map(t=>`<button class="rec-task" data-task="${t.id}"><span class="lv lv${t.lv}">${LV[t.lv]}</span><b>${esc(t.title)}</b><span class="muted">${esc(TOPICS.find(x=>x.id===t.t).name)}</span></button>`).join("")}</div>`:""}</section>`;
}
function levelBlock(xp){const L=levelOf(xp);const p=L.next?(xp-L.cur)/(L.next-L.cur):1;
  return `<div class="lvl"><div class="lvl-top"><span class="lvl-badge">${L.n}</span><div style="min-width:0"><b>${esc(L.name)}</b><span class="muted">${L.next?`«${esc(L.nextName)}» деңгейіне ${L.next-xp} XP қалды`:"Ең жоғары деңгей!"}</span></div></div><div class="goal-bar" style="flex:none"><i style="width:${p*100}%"></i></div></div>`}
function homeV(){
  if(S.role==="teacher")return `<div><span class="eyebrow">Мұғалімге</span><h1>Есептер банкі</h1><p class="muted" style="margin-top:6px">Оқушылар шығаратын барлық есеп. Есепті ашып, шартын, түсіндірмесін, кеңестерін және жиі қателерін көре аласыз.</p></div>${topicsGrid()}`;
  const solvedToday=Object.entries(S.solved).filter(([id,s])=>s.d===today()&&TASK[id]&&!TASK[id].gen).length;
  const goal=S.goal||3,p=Math.min(1,solvedToday/goal);
  const nt=nextTask();const total=TASKS.length,sc=solvedN(S);
  const name=S.nick?", "+esc(S.nick.split(" ")[0]):"";
  return `
  <div class="mobile-top"><div class="logo" style="display:flex;padding:0"><span style="font-family:var(--f-display);font-weight:700">Код<b style="color:var(--blue)">Қадам</b></span></div><span class="lv lv2">${ICON.flame.replace('<svg','<svg width="12" height="12" style="vertical-align:-1px"')} ${streakOf(S.days)} күн</span></div>
  <section class="hero">
    <div class="panel hello">
      <span class="eyebrow">Үй жұмысы алаңы</span>
      <h1>Сәлем${name}! Бүгін бір қадам алға басамыз ба?</h1>
      <p class="muted">Сабақта өткен тақырыпты таңда, есептерді шығар. Қате шықса — қорықпа: оны бірге талдаймыз, бірақ шешімді өзің табасың.</p>
      <div class="goal"><span style="font-weight:800" class="num">Бүгінгі мақсат: ${solvedToday} / ${goal}</span><div class="goal-bar" role="progressbar" aria-valuenow="${solvedToday}" aria-valuemax="${goal}"><i style="width:${p*100}%"></i></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${nt?`<button class="btn btn-primary" data-task="${nt.id}">${ICON.play} ${S.attempts[nt.id]?"Жалғастыру":"Бастау"}: ${esc(nt.title)}</button>`:`<span class="lv lv1">Барлық есеп шығарылды!</span>`}<button class="btn btn-ghost" data-nav2="progress">Прогресімді көру</button></div>
    </div>
    <div class="panel mini-stats">
      ${levelBlock(xpOf(S))}
      <div class="ms"><span class="v num" style="color:var(--blue)">${xpOf(S)}</span><span class="l">XP ұпай</span></div>
      <div class="ms"><span class="v num" style="color:var(--mint)">${sc}<small class="muted" style="font-size:.6em"> / ${total}</small></span><span class="l">Шығарылған есеп</span></div>
      <div class="ms"><span class="v num" style="color:var(--sun-ink)">${Object.keys(S.days).length}</span><span class="l">Белсенді күн</span></div>
      <div class="ms"><span class="v num" style="color:var(--coral)">${errTotal(S)}</span><span class="l">Талданған қате</span></div>
    </div>
  </section>
  ${hwCard()}
  <div class="two" style="align-items:start">${dailyCard()}${recCard(S)}</div>
  <section style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2>Тақырыптар</h2><span class="muted" style="font-size:.9rem">Мұғалім сабақта түсіндірген тақырыпты таңда</span></div>
    ${topicsGrid()}
  </section>`;
}

/* ---- topic ---- */
function topicV(id,lv){
  const tp=TOPICS.find(t=>t.id===id);const ts=TASKS.filter(t=>t.t===id);const d=ts.filter(t=>S.solved[t.id]).length;
  const list=ts.filter(t=>!lv||t.lv===lv);
  const gens=Object.values(S.gen||{}).filter(g=>g.t===id);
  return `<div class="crumbs"><button data-nav2="home">Тақырыптар</button><span>/</span><span>${esc(tp.name)}</span></div>
  <div class="panel topic-head ${tp.tone}"><div style="display:flex;gap:16px;align-items:center;min-width:0">${S.role==="teacher"?"":ring(d/ts.length)}<div style="min-width:0"><h1>${esc(tp.name)}</h1><p class="muted">${S.role==="teacher"?ts.length+" есеп":d+" / "+ts.length+" есеп шығарылды"} · ${esc(tp.about)}</p></div></div>
  <div class="chips" role="group" aria-label="Деңгей">${[0,1,2,3].map(l=>`<button class="chip" aria-pressed="${lv===l}" data-lv="${l}">${l?LV[l]:"Барлығы"}</button>`).join("")}</div></div>
  <div class="tasks">${list.map((t,i)=>{const s=taskState(t.id);return `<button class="task-row" data-task="${t.id}"><span class="state ${s}">${s==="done"?ICON.check:ts.indexOf(t)+1}</span><span style="min-width:0;display:flex;flex-direction:column;gap:3px"><b>${esc(t.title)}</b><span class="meta"><span class="lv lv${t.lv}">${LV[t.lv]}</span>${t.bugs?`<span class="lv lv3">${ICON.bug.replace('<svg','<svg width="11" height="11" style="vertical-align:-1px"')} ${t.bugs} қате</span>`:""}<span>+${PTS[t.lv]} XP</span>${S.attempts[t.id]?`<span>· ${S.attempts[t.id]} әрекет</span>`:""}${s==="tried"?`<span style="color:var(--sun-ink)">· жалғастыр</span>`:""}</span></span><span class="muted" aria-hidden="true">›</span></button>`}).join("")||`<div class="empty">Бұл деңгейде есеп жоқ.</div>`}</div>
  ${gens.length?`<div style="display:flex;flex-direction:column;gap:10px"><h2>ЖИ жасаған ұқсас жаттығулар</h2><div class="tasks">${gens.map(g=>{const s=taskState(g.id);return `<button class="task-row" data-task="${g.id}"><span class="state ${s}">${s==="done"?ICON.check:"ЖИ"}</span><span style="min-width:0;display:flex;flex-direction:column;gap:3px"><b>${esc(g.title)}</b><span class="meta"><span class="lv lv${g.lv}">${LV[g.lv]}</span><span>+5 XP</span><span>· «${esc((TASK[g.base]||{}).title||"")}» есебіне ұқсас</span></span></span><span class="muted" aria-hidden="true">›</span></button>`}).join("")}</div></div>`:""}`;
}

/* ---- task ---- */
let ws={tab:"st",hintOpen:0,last:null,skipPlan:{}};
function needsPlan(t){return S.role==="student"&&!t.bugs&&!S.solved[t.id]&&!(S.plans[t.id]&&(S.plans[t.id].a||"").trim())&&!ws.skipPlan[t.id]}
function taskV(id){
  const t=TASK[id],tp=TOPICS.find(x=>x.id===t.t);
  const ts=TASKS.filter(x=>x.t===t.t),idx=ts.indexOf(t);
  const tabs=[["st","Шарты"],["pl","Жоспар"],["ex","Есепті түсіну"],["hi","Кеңестер"],["mi","Жиі қателер"]].filter(([k])=>!(k==="pl"&&t.bugs)&&!(k==="mi"&&!(t.mist||[]).length));
  return `<div class="crumbs"><button data-nav2="home">Тақырыптар</button><span>/</span><button data-topic="${tp.id}">${esc(tp.name)}</button><span>/</span><span>${esc(t.title)}</span></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:12px;min-width:0"><span class="state ${taskState(id)}">${S.solved[id]?ICON.check:t.gen?"ЖИ":idx+1}</span><div style="min-width:0"><h1>${esc(t.title)}</h1><div class="lv-row" style="margin-top:4px"><span class="lv lv${t.lv}">${LV[t.lv]}</span>${t.bugs?`<span class="lv lv3">${t.bugs} қате жасырылған</span>`:""}${t.gen?`<span class="lv lv1">ЖИ жаттығуы</span>`:""}<span class="muted" style="font-weight:700;font-size:.85rem">${t.gen?"+5 XP":`+${PTS[t.lv]} XP · кеңессіз шығарсаң +5`}</span></div></div></div>
    <div style="display:flex;gap:8px">${t.gen?(TASK[t.base]?`<button class="btn btn-ghost" data-task="${t.base}">‹ Негізгі есеп</button>`:""):`${idx>0?`<button class="btn btn-ghost" data-task="${ts[idx-1].id}">‹ Алдыңғы</button>`:""}${idx<ts.length-1?`<button class="btn btn-ghost" data-task="${ts[idx+1].id}">Келесі ›</button>`:""}`}</div>
  </div>
  <div class="ws">
    <section class="panel side">
      <div class="tabs" role="tablist">
        ${tabs.map(([k,n])=>`<button role="tab" aria-selected="${ws.tab===k}" data-tab="${k}">${n}${k==="pl"&&S.plans[id]&&(S.plans[id].a||"").trim()?" ✓":""}</button>`).join("")}
      </div>
      <div class="tab-body" id="tabBody">${tabContent(t)}</div>
    </section>
    <section style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <div class="panel editor-card" style="position:relative">
        <div class="ed-bar"><span class="ed-file"><i></i>${t.fn?"functions.py":"main.py"}</span><button class="link" id="resetBtn" style="font-size:.85rem">Бастапқы күйге қайтару</button></div>
        <div class="editor" id="editor"><div class="gutter" id="gutter"></div><div class="code-wrap"><div class="errbar" id="errbar" hidden></div><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python коды"></textarea></div></div>
        <details class="own-input" id="ownBox"><summary>Өз деректеріммен іске қосу</summary>
          <div class="oi"><div><div class="eyebrow" style="margin-bottom:6px">Енгізу (әр мән жеке жолда)</div><textarea id="ownIn" spellcheck="false">${esc(t.tests[0].i||"")}</textarea></div><div><div class="eyebrow" style="margin-bottom:6px">Нәтиже</div><pre id="ownOut" class="muted">Мұнда бағдарламаның шығарғаны көрінеді</pre></div></div>
        </details>
        <div class="ed-actions"><button class="btn btn-ghost" id="runBtn">${ICON.play} Іске қосу</button><button class="btn btn-ghost" id="vizBtn" title="Код қалай орындалатынын қадам бойынша көру">${ICON.steps} Қадамдап көру</button><button class="btn btn-primary" id="checkBtn">${ICON.test} Тексеру</button><span class="grow"></span><span class="kbd">Ctrl + Enter — тексеру</span></div>
        ${needsPlan(t)?`<div class="plan-gate" id="planGate"><div class="pg-card"><span class="daily-ic" style="background:var(--blue-soft);color:var(--blue)">${ICON.bulb}</span><h3>Алдымен ойлан!</h3><p class="muted">Код жазбас бұрын есепті түсініп ал: не беріледі, не сұралады, қандай қадамдармен шығарасың? Жоспар үшін +3 XP.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" id="pgGo">Жоспар құру</button><button class="btn btn-ghost" id="pgSkip">Кейін</button></div></div></div>`:""}
      </div>
      <div class="panel feedback" id="feedback" aria-live="polite">${fbIdle()}</div>
    </section>
  </div>`;
}
function fbIdle(){return `<div class="fb-idle"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="6" width="36" height="28" rx="8" fill="var(--blue-soft)"/><path d="M11 16l5 4-5 4" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 25h9" stroke="var(--sun)" stroke-width="3" stroke-linecap="round"/></svg><p>Кодыңды жаз да, <b>Тексеру</b> батырмасын бас. Қате шықса, оны осы жерде бірге талдаймыз: не болды, қай жерде және өзіңе қандай сұрақ қою керек.</p></div>`}
function tabContent(t){
  if(ws.tab==="st"){
    const ex=t.tests.slice(0,2);
    return `<p class="statement">${t.text}</p>
    <div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Мысалдар</span>
    ${ex.map((x,i)=>t.fn?`<div class="ex-grid"><div class="io"><div class="h">Шақыру</div><pre>${esc(x.call)}</pre></div><div class="io"><div class="h">Нәтиже</div><pre>${esc(x.o)}</pre></div></div>`:`<div class="ex-grid"><div class="io"><div class="h">Енгізу</div><pre>${esc(x.i)||'<span class="muted">(жоқ)</span>'}</pre></div><div class="io"><div class="h">Шығару</div><pre>${esc(x.o)}</pre></div></div>`).join("")}
    </div>
    <p class="note">Тексеруде ${t.tests.length} тест бар. ${t.fn?"Тексеруші функцияңды өзі шақырады.":"input() ішіне мәтін жазудың қажеті жоқ — ол нәтижеге кірмейді."}</p>`;
  }
  if(ws.tab==="pl"){const pl=S.plans[t.id]||{};
    return `<p class="muted">Код жазбас бұрын есепті өз сөзіңмен түсіндір. Жақсы жоспар — жартылай шығарылған есеп.</p>
    <div class="plan-form">
      <div class="field"><label for="pq1">1. Есепте не сұралып тұр?</label><textarea id="pq1" rows="2" maxlength="300" placeholder="Өз сөзіңмен бір сөйлеммен жаз">${esc(pl.q1||"")}</textarea></div>
      <div class="field"><label for="pq2">2. Қандай деректер беріледі?</label><textarea id="pq2" rows="2" maxlength="300" placeholder="Неше мән, қандай түрде: сан ба, мәтін бе?">${esc(pl.q2||"")}</textarea></div>
      <div class="field"><label for="pq3">3. Қандай нәтиже шығару керек?</label><textarea id="pq3" rows="2" maxlength="300" placeholder="Нені, қандай пішімде шығарамын?">${esc(pl.q3||"")}</textarea></div>
      <div class="field"><label for="pa">4. Алгоритм: шығару қадамдары</label><textarea id="pa" rows="5" maxlength="600" placeholder="1. Екі санды енгізу.&#10;2. Сандарды салыстыру.&#10;3. Үлкенін шығару.">${esc(pl.a||"")}</textarea></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="planSave">Жоспарды сақтау</button>${SAMPLE?`<button class="btn btn-ghost" id="planAsk">${ICON.chat.replace('<svg','<svg width="16" height="16"')} ЖИ-ден пікір сұрау</button>`:""}</div>
      <div id="planFb"></div>
    </div>`}
  if(ws.tab==="ex"){const e=t.ex;return `<div class="explain"><dl>
    <div><dt>Не беріледі?</dt><dd>${e.given}</dd></div>
    <div><dt>Не шығару керек?</dt><dd>${e.need}</dd></div>

const KW=/\b(and|as|break|class|continue|def|elif|else|except|False|finally|for|from|if|import|in|is|lambda|None|not|or|pass|return|True|try|while|with|yield|global)\b/;
function highlight(src){
  const re=/(#[^\n]*)|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|\b(\d+(?:\.\d+)?)\b|\b(and|as|break|class|continue|def|elif|else|except|False|finally|for|from|if|import|in|is|lambda|None|not|or|pass|return|True|try|while|with|yield|global)\b|\b(print|input|int|float|str|len|range|list|dict|set|sum|min|max|abs|round|sorted|map|enumerate|bool|type|split|append|join|lower|upper|items)\b/g;
  let out="",last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));const cls=m[1]?"com":m[2]?"str":m[3]?"num":m[4]?"kw":"fn";out+=`<span class="tk-${cls}">${esc(m[0])}</span>`;last=re.lastIndex}
  return out+esc(src.slice(last))+"\n ";
}

  const sync=()=>{hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop;const eb=$("#errbar");if(errLine){eb.hidden=false;eb.style.top=(12+(errLine-1)*22-ta.scrollTop)+"px"}else eb.hidden=true};

  if(/\bif\b/.test(code))return "Шарттарың қандай жағдайларды ажыратады? Шекаралық мәнде (мысалы, тең болғанда) не болады?";
  if(/int\(/.test(code))return "Неге int() қолдандың? Онсыз бағдарлама қалай жұмыс істер еді?";

function authMsg(e){const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return "Логин немесе құпиясөз қате. Қайта тексеріп көр.";

  if(/weak-password/.test(c))return "Құпиясөз тым қарапайым. Ұзынырақ құпиясөз ойлап тап.";
  if(/operation-not-allowed/.test(c))return "Firebase-те Email/Password кіру тәсілі қосылмаған (нұсқаулықтың 2-қадамы).";
  return "Кіру мүмкін болмады: "+(c||String(e&&e.message||e));
}

  const list=ASSIGN.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  return `<div><span class="eyebrow">Мұғалім бөлімі</span><h1>Үй жұмыстары</h1><p class="muted" style="margin-top:6px">Сабақтан кейін сыныпқа есептер беріңіз. Оқушылар оларды басты бетте көреді, ал сіз кім орындағанын осы жерден бақылайсыз.</p></div>
  <section class="panel card-pad"><h2>Жаңа үй жұмысы</h2>
    <div class="asg-form">
      <div class="field"><label for="aTitle">Атауы</label><input id="aTitle" maxlength="60" placeholder="Мысалы: Циклдар, 1-апта" value="${esc(asgDraft.title)}"></div>
      <div class="field"><label for="aCls">Сынып</label><input id="aCls" maxlength="12" list="clsList" placeholder="Бос болса — барлық сынып" value="${esc(asgDraft.cls)}"><datalist id="clsList">${cl.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <div class="field"><label for="aDue">Тапсыру мерзімі</label><input id="aDue" type="date" value="${esc(asgDraft.due)}"></div>
    </div>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><span class="eyebrow">Есептерді таңдаңыз</span><span class="lv lv1 num">Таңдалды: ${sel.size}</span></div>
    <div class="pick-grid">${TOPICS.map(tp=>`<div class="pick-col"><b>${esc(tp.name)}</b>${TASKS.filter(t=>t.t===tp.id).map(t=>`<label class="pick"><input type="checkbox" data-apick="${t.id}" ${sel.has(t.id)?"checked":""}><span>${esc(t.title)}</span><span class="lv lv${t.lv}">${LV[t.lv]}</span></label>`).join("")}</div>`).join("")}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" id="aCreate">${ICON.clip.replace('<svg','<svg width="18" height="18"')} Үй жұмысын беру</button>${asgMsg?`<span class="form-err">${esc(asgMsg)}</span>`:""}</div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px"><h2>Берілген үй жұмыстары</h2>
  ${list.length?list.map(a=>{const ts=(a.tasks||[]).map(i=>TASK[i]).filter(Boolean);const studs=(board||[]).filter(r=>!a.cls||(r.cls||"").toUpperCase()===a.cls.toUpperCase());
    const prog=studs.map(r=>({r,d:ts.filter(t=>(r.solved||{})[t.id]).length}));const full=prog.filter(x=>x.d===ts.length).length;const dt=dueText(a.due);
    return `<div class="panel card-pad asg"><div class="hw-top"><div style="min-width:0"><h3>${esc(a.title||"Үй жұмысы")}</h3><span class="muted" style="font-size:.88rem;font-weight:700">${a.cls?esc(a.cls)+" сынып":"Барлық сынып"} · ${ts.length} есеп${a.due?" · "+esc(fmtDate(a.due))+" дейін":""}</span></div><span class="pill ${dt==="мерзімі өтті"?"bad":"try"}">${esc(dt)}</span></div>
      <div class="bar-row"><span class="name">${full} / ${studs.length} оқушы толық орындады</span><span class="num muted" style="font-weight:800">${studs.length?Math.round(full/studs.length*100):0}%</span><div class="track"><i style="width:${studs.length?full/studs.length*100:0}%;background:var(--mint)"></i></div></div>
      <div class="hw-tasks">${ts.map(t=>{const n=studs.filter(r=>(r.solved||{})[t.id]).length;return `<span class="chip-task">${esc(t.title)} <span class="muted num">${n}/${studs.length}</span></span>`}).join("")}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" data-aopen="${a.id}">${asgOpen===a.id?"Жасыру":"Оқушылар бойынша"}</button>${asgDel===a.id?`<span class="note" style="align-self:center">Жоюды растайсыз ба?</span><button class="btn btn-ghost" style="color:var(--coral-ink)" data-adelok="${a.id}">Иә, жою</button><button class="btn btn-ghost" data-adel="">Жоқ</button>`:`<button class="btn btn-ghost" data-adel="${a.id}">Жою</button>`}</div>
      ${asgOpen===a.id?(studs.length?`<div class="tbl-wrap"><table class="board"><thead><tr><th>Оқушы</th><th>Сынып</th><th class="r">Орындады</th><th>Қалғаны</th></tr></thead><tbody>${prog.sort((x,y)=>y.d-x.d).map(({r,d})=>`<tr class="click" data-stu="${esc(r.id)}"><td><b>${esc(stuName(r))}</b></td><td>${esc(r.cls||"—")}</td><td class="r num"><span class="pill ${d===ts.length?"ok":d?"try":"none"}">${d} / ${ts.length}</span></td><td class="muted">${ts.filter(t=>!(r.solved||{})[t.id]).map(t=>esc(t.title)).join(", ")||"—"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Бұл сыныптан әзірге оқушы кірмеген.</div>`):""}
    </div>`}).join(""):`<div class="empty">Әзірге үй жұмысы берілмеген.</div>`}
  </section>`;
}
function bindAssign(){
  const t=$("#aTitle");if(!t)return;
  t.oninput=()=>asgDraft.title=t.value;$("#aCls").oninput=e=>asgDraft.cls=e.target.value;$("#aDue").oninput=e=>asgDraft.due=e.target.value;
  document.querySelectorAll("[data-apick]").forEach(c=>c.onchange=()=>{const id=c.dataset.apick;asgDraft.tasks=asgDraft.tasks.filter(x=>x!==id);if(c.checked)asgDraft.tasks.push(id);const L=document.querySelector(".asg-form ~ div .lv");if(L)L.textContent="Таңдалды: "+asgDraft.tasks.length});
  $("#aCreate").onclick=async()=>{
    if(!asgDraft.title.trim()){asgMsg="Үй жұмысының атауын жазыңыз.";render();return}
    if(!asgDraft.tasks.length){asgMsg="Кемінде бір есеп таңдаңыз.";render();return}
    const order=TASKS.map(x=>x.id);
    const doc={title:asgDraft.title.trim().slice(0,60),cls:asgDraft.cls.trim().toUpperCase().slice(0,12),due:asgDraft.due||"",tasks:asgDraft.tasks.slice().sort((a,b)=>order.indexOf(a)-order.indexOf(b)),created:Date.now()};
    try{await DB.collection("assign").add(doc);asgDraft={title:"",cls:"",due:"",tasks:[]};asgMsg="";toast("Үй жұмысы берілді");render()}
    catch(e){asgMsg="Сақтау мүмкін болмады. Бетті жаңартып, қайталап көріңіз.";render()}
  };
  document.querySelectorAll("[data-aopen]").forEach(b=>b.onclick=()=>{asgOpen=asgOpen===b.dataset.aopen?null:b.dataset.aopen;render()});
  document.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>{asgDel=b.dataset.adel||null;render()});
  document.querySelectorAll("[data-adelok]").forEach(b=>b.onclick=async()=>{try{await DB.doc("assign/"+b.dataset.adelok).delete();toast("Үй жұмысы жойылды")}catch(e){toast("Жою мүмкін болмады")}asgDel=null;render()});
}

/* ---- teacher: CSV report ---- */
let DOWNLOADS=null;
async function exportCsv(){
  if(!DOWNLOADS){toast("Файл жүктеу бұл көріністе қолжетімсіз");return}
  const rows=(board||[]).filter(r=>!classCls||(r.cls||"").trim()===classCls).sort((a,b)=>(a.cls||"").localeCompare(b.cls||"")||stuName(a).localeCompare(stuName(b)));
  const head=["Оқушы","Сынып","Деңгей","XP","Шығарылған есеп (барлығы "+TASKS.length+")","Меңгерілген тақырып","Белсенді күн","Серия","Жоспар саны","Түсіндірме саны","Тіркелген қате","Жиі қатесі","Соңғы белсенділік",...TOPICS.map(t=>t.name)];
  const q=v=>{const x=String(v==null?"":v);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const lines=[head.map(q).join(";")];
  for(const r of rows){const wk=WORKS[r.id]||{};const sv=r.solved||{};
    lines.push([stuName(r),r.cls||"",levelOf(r.xp||0).name,r.xp||0,r.solvedCount||0,r.topics||0,r.daysCount||0,streakOf(r.days||{}),Object.keys(wk.plans||{}).length,Object.keys(wk.explain||{}).length,Object.values(r.errs||{}).reduce((a,b)=>a+b,0),topErr(r),r.updated?new Date(r.updated).toLocaleDateString("kk-KZ"):"",...TOPICS.map(tp=>{const ts=TASKS.filter(t=>t.t===tp.id);return ts.filter(t=>sv[t.id]).length+"/"+ts.length})].map(q).join(";"))}
  try{await DOWNLOADS.save({filename:"kodqadam-"+(classCls?classCls.replace(/[^\w-]/g,"x"):"barlyq")+"-"+today()+".csv",data:"﻿"+lines.join("\r\n")})}
  catch(e){if(!e||e.code!=="declined")toast("Файлды сақтау мүмкін болмады")}
}

/* ---- bindings ---- */
function bindView(){
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go({v:"topic",id:b.dataset.topic}));
  document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{ws={tab:"st",hintOpen:0,last:null,skipPlan:ws.skipPlan||{}};go({v:"task",id:b.dataset.task})});
  document.querySelectorAll("[data-nav2]").forEach(b=>b.onclick=()=>go({v:b.dataset.nav2}));
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>go({v:"topic",id:route.id,lv:+b.dataset.lv}));
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ws.tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));$("#tabBody").innerHTML=tabContent(TASK[route.id]);bindView()});
  document.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{const id=route.id;const i=+b.dataset.hint;S.hints[id]=Math.max(S.hints[id]||0,i+1);ws.hintOpen=i+1;save();$("#tabBody").innerHTML=tabContent(TASK[id]);bindView()});
  document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{rateBy=b.dataset.rate;render()});
  const ns=$("#nickSave");if(ns)ns.onclick=()=>{S.nick=$("#nickIn").value.trim().slice(0,24);save();toast("Атың сақталды");render()};
  document.querySelectorAll("[data-rcls]").forEach(b=>b.onclick=()=>{rateCls=b.dataset.rcls;render()});
  document.querySelectorAll("[data-ccls]").forEach(b=>b.onclick=()=>{classCls=b.dataset.ccls;render()});
  const ps=$("#planSave");if(ps)ps.onclick=()=>savePlan(route.id);
  const pa=$("#planAsk");if(pa)pa.onclick=()=>askPlan(route.id);
  bindAssign();
  bindAccounts();
  const cv=$("#csvBtn");if(cv)cv.onclick=exportCsv;
  document.querySelectorAll("[data-stu]").forEach(tr=>{const open=()=>go({v:"tstudent",id:tr.dataset.stu});tr.onclick=open;tr.onkeydown=e=>{if(e.key==="Enter")open()}});
}

/* ============ BOOT (Firebase) ============ */
try{document.documentElement.lang="kk"}catch(e){}
let FB=null,FB_FAILED=false,SCORES={},pendingTeacher=null,scoresUnsub=null;
DOWNLOADS={save:async({filename,data})=>{const b=new Blob([data],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}};
function rebuildBoard(){
  board=S.role==="teacher"?USERS.map(u=>Object.assign({},SCORES[u.id]||{},{id:u.id,nick:u.name,cls:u.cls||""})):Object.entries(SCORES).map(([id,d])=>Object.assign({id},d));
  if(S.role&&["rating","class","tstudent","assign","accounts"].includes(route.v))render();
}
function resetSession(){
  for(const u of [scoresUnsub,usersUnsub,worksUnsub,assignUnsub])try{u&&u()}catch(e){}
  scoresUnsub=usersUnsub=worksUnsub=assignUnsub=null;
  DB=null;UID=null;board=null;SCORES={};USERS=[];WORKS={};ASSIGN=[];TEACHER_OK=null;canWrite=true;
  S=blank();W={};LSKEY="kodqadam.v1.anon";WKEY="kodqadam.works.anon";route={v:"home"};ws={tab:"st",hintOpen:0,last:null,skipPlan:{}};accNew=[];accMsg="";
}
async function doLogout(){try{await FB.logout()}catch(e){resetSession();render()}}
async function checkSetup(){try{const t=await FB.DB.doc("config/teacher").get();setupNeeded=!t.exists}catch(e){setupNeeded=false}}
async function startSession(u){
  gateBusy=true;render();
  resetSession();UID=u.uid;DB=FB.DB;loadLocal(UID);
  let teacher=null;try{const t=await DB.doc("config/teacher").get();teacher=t.exists?t.data():null}catch(e){}
  if(!teacher&&pendingTeacher){
    try{await DB.doc("config/teacher").set({uid:UID,email:pendingTeacher.email,name:pendingTeacher.name,created:Date.now()});teacher={uid:UID,name:pendingTeacher.name}}
    catch(e){gateErr="Мұғалім аккаунтын тіркеу мүмкін болмады. Firestore ережелерін тексеріңіз (нұсқаулықтың 2-қадамы).";}
    pendingTeacher=null;setupNeeded=false;
  }
  if(teacher&&teacher.uid===UID){
    TEACHER_OK=true;S.role="teacher";S.nick=teacher.name||"Мұғалім";route={v:"class"};
    startUsers();startTeacher();
  }else{
    TEACHER_OK=false;
    let prof=null;try{const p=await DB.doc("users/"+UID).get();prof=p.exists?p.data():null}catch(e){}
    if(!prof){gateErr=gateErr||"Бұл аккаунт оқушылар тізімінде жоқ. Мұғаліміңе хабарлас.";const keep=gateErr;resetSession();gateBusy=false;try{await FB.logout()}catch(e){}gateErr=keep;render();return}
    S.role="student";
    try{const snap=await DB.doc("scores/"+UID).get();if(snap.exists)mergeRemote(snap.data())}catch(e){}
    try{const w2=await DB.doc("works/"+UID).get();if(w2.exists)mergeWorks(w2.data())}catch(e){}
    S.nick=prof.name||"Оқушы";S.cls=prof.cls||"";route={v:"home"};
    lsSet(LSKEY,JSON.stringify(S));dirty=true;pushRemote();
  }
  scoresUnsub=DB.collection("scores").onSnapshot(qs=>{const m={};qs.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});SCORES=m;rebuildBoard()},()=>{});
  startAssign();
  gateBusy=false;gateErr="";gateMode="login";render();
}
function initFirebase(){
  if(FB)return;FB=window.FBAPI;
  if(!FB||!FB.ok){gateBusy=false;render();return}
  SAMPLE=FB.AI||null;
  let first=true;
  FB.onUser(async u=>{
    if(u){await startSession(u)}
    else{const keep=gateErr;resetSession();await checkSetup();gateBusy=false;gateErr=keep;render()}
    first=false;
  });
}
render();
window.addEventListener("fb-ready",initFirebase);
if(window.FBAPI)initFirebase();
setTimeout(()=>{if(!FB){FB_FAILED=true;gateBusy=false;render()}},20000);
window.addEventListener("load",()=>{checkPy();});
setTimeout(()=>{if(!pyReady)checkPy()},6000);
